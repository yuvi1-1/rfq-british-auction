[project]
name = "rfq-auction-backend"
version = "1.0.0"
description = "British Auction RFQ system: FastAPI API, auction engine and Celery workers"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20",
    "asyncpg>=0.32",
    "celery[redis]>=5.7",
    "fastapi>=0.165",
    "pydantic>=2.14",
    "pydantic-settings>=2.16.3",
    "redis>=8.1",
    "sqlalchemy[asyncio]>=2.1",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.uv]
# This is a deployable service, not a library: dependencies only, no wheel build.
package = false

[tool.ruff]
line-length = 100
# Format with 3.13 syntax so `except (A, B):` keeps its familiar parentheses.
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
# B008: FastAPI's Depends()/Header() in argument defaults is the framework's idiom.
ignore = ["B008"]

[tool.ruff.lint.isort]
# ./alembic holds our migrations; the import name refers to the installed package.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
testpaths = ["tests"]
