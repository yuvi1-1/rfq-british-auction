name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: rfq
          POSTGRES_PASSWORD: rfq
          POSTGRES_DB: rfq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rfq -d rfq_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://rfq:rfq@localhost:5432/rfq_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - name: Migrations match the models
        env:
          DATABASE_URL: postgresql+asyncpg://rfq:rfq@localhost:5432/rfq_test
        run: uv run alembic upgrade head && uv run alembic check
      - run: uv run pytest -q

  frontend:
    name: Frontend (types + lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build
